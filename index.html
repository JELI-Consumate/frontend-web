<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F8F9FF" />
    <!--
      CSP ketat: tidak ada inline script, hanya sumber yang dibutuhkan.
      - connect-src: API backend + endpoint token Google (OAuth implicit).
      - script/frame: Google Identity Services.
      Sesuaikan host API lewat build kalau berbeda dari default di bawah.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        img-src 'self' data: blob: https:;
        font-src 'self';
        style-src 'self' 'unsafe-inline';
        script-src 'self' https://accounts.google.com https://apis.google.com;
        frame-src https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com;
        connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com http://localhost:8000 http://127.0.0.1:8000;
        form-action 'self'
      "
    />
    <link rel="preload" href="/fonts/PlusJakartaSans-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <title>Aplikasi Perlindungan Konsumen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
